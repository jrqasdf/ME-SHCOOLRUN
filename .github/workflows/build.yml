name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            campus_route_apk_project
          sparse-checkout-cone-mode: true

      - name: Assemble build dir
        run: |
          SRC=campus_route_apk_project
          rm -rf app && mkdir -p app
          cp "$SRC/mobile/main.py" "$SRC/mobile/buildozer.spec" app/
          cp -r "$SRC/core" "$SRC/assets" app/
          cp "$SRC/campus_profile.json" app/
          sed -i 's/\r$//' app/buildozer.spec
          sed -i '/^\[app\]/a android.accept_sdk_license = True' app/buildozer.spec
          sed -i '/^\[app\]/a android.build_tools_version = 33.0.2' app/buildozer.spec
          ls app

      - name: Build APK with official buildozer image
        run: |
          docker run --rm -v "$PWD/app":/home/user/hostcwd \
            kivy/buildozer:latest \
            bash -lc "cd /home/user/hostcwd && buildozer -v android debug"

      - uses: actions/upload-artifact@v4
        with:
          name: campusroute-debug-apk
          path: app/bin/*.apk
