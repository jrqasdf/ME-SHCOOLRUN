name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            campus_route_apk_project
          sparse-checkout-cone-mode: true

      - name: 组装构建目录
        run: |
          SRC=campus_route_apk_project
          mkdir -p app
          cp "$SRC/mobile/main.py" "$SRC/mobile/buildozer.spec" app/
          cp -r "$SRC/core" "$SRC/assets" app/
          cp "$SRC/campus_profile.json" app/
          sed -i 's/\r$//' app/buildozer.spec
          ls app

      - name: 构建 APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          workdir: app
          buildozer_version: stable

      - uses: actions/upload-artifact@v4
        with:
          name: campusroute-debug-apk
          path: app/bin/*.apk
