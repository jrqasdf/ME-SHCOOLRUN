name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            campus_route_apk_project
          sparse-checkout-cone-mode: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libffi-dev libssl-dev libltdl-dev cmake
          sudo apt-get install -y libtinfo5 || true

      - name: 预装 Android SDK 并接受许可证
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          curl -sSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline-tools
          mkdir -p "$SDK/cmdline-tools"
          mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" > /dev/null
          echo "== build-tools =="; ls "$SDK/build-tools"

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: 构建 APK
        run: |
          sed -i 's/\r$//' campus_route_apk_project/mobile/build_apk.sh
          sed -i 's/\r$//' campus_route_apk_project/mobile/buildozer.spec
          sed -i '/^\[app\]/a android.accept_sdk_license = True' campus_route_apk_project/mobile/buildozer.spec
          sed -i '/^\[app\]/a android.build_tools_version = 33.0.2' campus_route_apk_project/mobile/buildozer.spec
          bash campus_route_apk_project/mobile/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: campusroute-debug-apk
          path: campus_route_apk_project/mobile/.build/dist/*.apk
