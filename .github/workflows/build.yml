name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            campus_route_apk_project
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libffi-dev libssl-dev libltdl-dev cmake
          sudo apt-get install -y libtinfo5 || true

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: 构建 APK
        run: |
          sed -i 's/\r$//' campus_route_apk_project/mobile/build_apk.sh
          sed -i 's/\r$//' campus_route_apk_project/mobile/buildozer.spec
          bash campus_route_apk_project/mobile/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: campusroute-debug-apk
          path: campus_route_apk_project/mobile/.build/dist/*.apk
